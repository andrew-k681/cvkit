[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvkit"
version = "0.1.0"
description = "Command-line toolkit for building object-detection datasets from video: frame sourcing, candidate mining, human review, and Roboflow dataset operations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "andrew-k681" }]
keywords = ["computer-vision", "dataset", "annotation", "yolo", "roboflow", "active-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# No runtime dependencies. Nothing in the base install imports a third-party
# package -- `cvkit frames` shells out to ffmpeg and the rest is stdlib. Every
# heavy dependency belongs to the commands that actually import it, so someone
# who only wants the Roboflow commands never installs OpenCV, and someone who
# only extracts frames installs nothing at all.
dependencies = []

[project.optional-dependencies]
# contact sheets and export repair: sheets, collect, verify, record, fix-export
images = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]
# anything that runs a model: mine, train, review-video
# (review-video also needs cv2 for its window, hence numpy/opencv here too)
detect = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    # Not arbitrary floors: ULTRALYTICS_SAFE_LOAD does not exist before
    # ultralytics 8.4.67, and the torch probe behind it needs 2.6. Below
    # either, restricted checkpoint loading is silently inert -- see
    # detector.safe_load_gap, which refuses to load rather than pretend.
    "ultralytics>=8.4.67",
    "torch>=2.6",
    # train.py reads a data.yaml itself before handing it to Ultralytics, to
    # refuse the `download:` key Ultralytics would execute. Ultralytics pulls
    # PyYAML in anyway; we import it, so we declare it.
    "pyyaml>=6",
]
# `tag` talks to the REST API directly and needs nothing but an HTTP client.
# Kept separate because the SDK below pulls 30-odd packages (matplotlib, PIL,
# typer, its own OpenCV) that a tagging loop has no use for.
roboflow-api = ["requests>=2.31"]
# upload-images, mark-null and upload-weights use the official SDK
roboflow = [
    "roboflow>=1.1",
    "requests>=2.31",
]
# the download command
download = ["yt-dlp>=2024.1"]

dev = [
    "pytest>=7",
    "pyyaml>=6",         # the data.yaml guard is tested in a base+dev install
    "pyflakes>=3",
    "cyclonedx-bom>=4",
]

all = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.4.67",
    "torch>=2.6",
    "pyyaml>=6",
    "roboflow>=1.1",
    "requests>=2.31",
    "yt-dlp>=2024.1",
]

[project.urls]
Homepage = "https://github.com/andrew-k681/cvkit"
Issues = "https://github.com/andrew-k681/cvkit/issues"

[project.scripts]
cvkit = "cvkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvkit"]
