name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and newest interpreters the package claims to support
        python-version: ["3.9", "3.13"]
    steps:
      # first-party GitHub actions, pinned to a major version tag
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # base plus dev only, so the smoke test below runs against a genuine
        # base install: every command must parse its own args with no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI smoke test
        # On a base install the commands gated on an extra cannot import their
        # module at all, so `--help` exits 1 *by design*, naming the extra
        # (cli.py's ImportError handler). Either outcome is a pass; a traceback
        # or a message that names no extra is not. That is what checks every
        # COMMANDS entry carries its fifth field -- convention 1 in AGENTS.md.
        run: |
          cvkit --version
          for c in download frames mine sheets collect verify record \
                   review-video fix-export train upload-images mark-null \
                   tag upload-weights; do
            out=$(cvkit "$c" --help 2>&1) && continue
            case "$out" in
              *"pip install 'cvkit["*) echo "  $c: gated, names its extra" ;;
              *) echo "FAIL: cvkit $c --help"; echo "$out"; exit 1 ;;
            esac
          done
      - name: Add the images extra
        # A handful of tests reach into fix_export and mining.sheets, which
        # carry a module-level numpy/cv2 import by convention. They skip on a
        # base install; install the extra so CI actually runs them. Still no
        # torch and no Roboflow SDK -- those stay stubbed.
        run: pip install -e ".[dev,images]"
      - name: Test
        run: python -m pytest tests/ -q

  sbom:
    # Produces a current CycloneDX SBOM for Dependency-Track.
    #
    # Deliberately NOT a drift check against the committed bom.json: that file
    # is a resolved snapshot, so any upstream release would fail an unrelated
    # PR. The committed copy is refreshed on purpose with ./scripts/make_bom.sh;
    # this job guarantees a current one always exists as a build artifact.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the SBOM tooling
        run: python -m pip install --upgrade pip cyclonedx-bom
      - name: Generate SBOM
        run: ./scripts/make_bom.sh
      - name: Validate against the CycloneDX 1.6 schema
        run: |
          pip install "cyclonedx-python-lib[validation]"
          python - <<'EOF'
          from cyclonedx.validation.json import JsonStrictValidator
          from cyclonedx.schema import SchemaVersion
          err = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open("bom.json").read())
          # Not `raise ... if err else print(...)`: that parses as
          # `raise (X if err else print(...))`, so a VALID bom prints, gets
          # None back, and raises None -> "exceptions must derive from
          # BaseException". It could never pass.
          if err:
              raise SystemExit(f"invalid SBOM: {err!r}")
          print("SBOM valid")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: bom.json
          if-no-files-found: error
